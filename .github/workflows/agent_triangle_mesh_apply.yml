name: Agent Triangle Mesh Apply

on:
  push:
    branches:
      - complete/opengl-fine-frame-passes
      - complete/triangle-mesh-collision

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/triangle-mesh-collision
          fetch-depth: 0

      - name: Execute checked-in patch payload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent_triangle_mesh_patch.yml').read_text()
          begin_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit source milestone"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          payload = workflow[begin:end]
          lines = payload.splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(payload, 'triangle_mesh_patch_payload.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Commit source milestone and remove helpers
        shell: bash
        run: |
          rm .github/workflows/agent_triangle_mesh_patch.yml
          rm .github/workflows/agent_triangle_mesh_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Physics: add accelerated static triangle mesh colliders"
          git push origin HEAD:complete/triangle-mesh-collision
