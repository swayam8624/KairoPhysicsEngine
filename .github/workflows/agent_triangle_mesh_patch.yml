name: Agent Triangle Mesh Patch

on:
  push:
    branches:
      - complete/triangle-mesh-collision

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/triangle-mesh-collision
          fetch-depth: 0

      - name: Apply triangle-mesh engine milestone
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Collider: shape, validation, local BVH, and world bounds.
          # ------------------------------------------------------------
          p = Path('Collider.cppm')
          s = p.read_text()

          s = s.replace(
              'import Kairo.Foundation.Geometry.AABB;\nimport Kairo.Foundation.PhysicsMath;',
              'import Kairo.Foundation.Geometry.AABB;\nimport Kairo.Foundation.Spatial.Types;\nimport Kairo.Foundation.Spatial.BVH;\nimport Kairo.Foundation.Spatial.BVHBuilder;\nimport Kairo.Foundation.PhysicsMath;', 1)

          anchor = '''    struct ConvexHullCollider final\n    {\n        std::vector<Vec3f> Vertices;\n        std::vector<std::array<std::uint32_t, 3>> Faces;\n    };\n\n    using ColliderShape =\n        std::variant<SphereCollider, CapsuleCollider, PlaneCollider, AABBCollider,\n            BoxCollider, ConvexHullCollider>;'''
          replacement = '''    struct ConvexHullCollider final\n    {\n        std::vector<Vec3f> Vertices;\n        std::vector<std::array<std::uint32_t, 3>> Faces;\n    };\n\n    /// Concave triangle collision surface accelerated in collider-local space.\n    ///\n    /// Vertices and triangle indices are immutable authored geometry after the\n    /// collider is created. `Acceleration` stores one KairoSpatial BVH primitive\n    /// per triangle; because that tree is local-space, rigid world transforms do\n    /// not require rebuilding it. `SurfaceThickness` turns the mathematically\n    /// zero-volume triangles into a thin collision shell for robust GJK/EPA\n    /// contact generation while ray and sweep tests remain triangle-exact.\n    struct TriangleMeshCollider final\n    {\n        std::vector<Vec3f> Vertices;\n        std::vector<std::array<std::uint32_t, 3>> Triangles;\n        kairo::foundation::spatial::BVH Acceleration;\n        float SurfaceThickness = 1.0e-3f;\n        bool DoubleSided = true;\n    };\n\n    using ColliderShape =\n        std::variant<SphereCollider, CapsuleCollider, PlaneCollider, AABBCollider,\n            BoxCollider, ConvexHullCollider, TriangleMeshCollider>;'''
          if anchor not in s:
              raise SystemExit('Collider shape anchor not found')
          s = s.replace(anchor, replacement, 1)

          anchor = '''        if (const auto* hull = std::get_if<ConvexHullCollider>(&collider.Shape))\n        {\n            AABBf bounds = AABBf::Empty();\n            const Quaternionf rotation = WorldColliderRotation(body, collider);\n            for (const Vec3f& vertex : hull->Vertices)\n            {\n                bounds.ExpandToInclude(center + Rotate(rotation, vertex));\n            }\n            return bounds;\n        }\n\n        return AABBf::Empty();'''
          replacement = '''        if (const auto* hull = std::get_if<ConvexHullCollider>(&collider.Shape))\n        {\n            AABBf bounds = AABBf::Empty();\n            const Quaternionf rotation = WorldColliderRotation(body, collider);\n            for (const Vec3f& vertex : hull->Vertices)\n            {\n                bounds.ExpandToInclude(center + Rotate(rotation, vertex));\n            }\n            return bounds;\n        }\n\n        if (const auto* mesh = std::get_if<TriangleMeshCollider>(&collider.Shape))\n        {\n            if (mesh->Acceleration.Empty()) return AABBf::Empty();\n            const AABBf local = mesh->Acceleration.Root().Bounds;\n            const Quaternionf rotation = WorldColliderRotation(body, collider);\n            AABBf bounds = AABBf::Empty();\n            for (std::uint32_t mask = 0u; mask < 8u; ++mask)\n            {\n                const Vec3f corner\n                {\n                    (mask & 1u) != 0u ? local.Max.x : local.Min.x,\n                    (mask & 2u) != 0u ? local.Max.y : local.Min.y,\n                    (mask & 4u) != 0u ? local.Max.z : local.Min.z\n                };\n                bounds.ExpandToInclude(center + Rotate(rotation, corner));\n            }\n            return bounds;\n        }\n\n        return AABBf::Empty();'''
          if anchor not in s:
              raise SystemExit('WorldAABB anchor not found')
          s = s.replace(anchor, replacement, 1)

          anchor = '''        else if (auto* plane = std::get_if<PlaneCollider>(&shape))\n        {\n            RequireFinite(plane->Normal, "PlaneCollider.Normal");\n            RequireFinite(plane->Distance, "PlaneCollider.Distance");\n            plane->Normal = SafeNormalize(plane->Normal, Vec3f::Up());\n        }\n\n        return { id, true, body, localCenter, localRotation.Normalized(), shape, material, 1u, 0xFFFF'FFFFu, false, 1u };'''
          replacement = '''        else if (auto* mesh = std::get_if<TriangleMeshCollider>(&shape))\n        {\n            using namespace kairo::foundation::spatial;\n            if (mesh->Vertices.size() < 3u || mesh->Triangles.empty())\n                throw std::invalid_argument(\n                    "TriangleMeshCollider requires vertices and at least one triangle.");\n            RequirePositive(mesh->SurfaceThickness,\n                "TriangleMeshCollider.SurfaceThickness");\n\n            for (const Vec3f& vertex : mesh->Vertices)\n                RequireFinite(vertex, "TriangleMeshCollider.Vertex");\n\n            std::vector<SpatialPrimitive> primitives;\n            primitives.reserve(mesh->Triangles.size());\n            for (std::size_t index = 0u; index < mesh->Triangles.size(); ++index)\n            {\n                const auto& triangle = mesh->Triangles[index];\n                if (triangle[0] >= mesh->Vertices.size() ||\n                    triangle[1] >= mesh->Vertices.size() ||\n                    triangle[2] >= mesh->Vertices.size() ||\n                    triangle[0] == triangle[1] || triangle[1] == triangle[2] ||\n                    triangle[2] == triangle[0])\n                    throw std::invalid_argument(\n                        "TriangleMeshCollider triangle contains invalid vertex indices.");\n\n                const Vec3f& a = mesh->Vertices[triangle[0]];\n                const Vec3f& b = mesh->Vertices[triangle[1]];\n                const Vec3f& c = mesh->Vertices[triangle[2]];\n                if (Cross(b - a, c - a).LengthSquared() <= 1.0e-12f)\n                    throw std::invalid_argument(\n                        "TriangleMeshCollider contains a degenerate triangle.");\n\n                AABBf bounds = AABBf::Empty();\n                bounds.ExpandToInclude(a);\n                bounds.ExpandToInclude(b);\n                bounds.ExpandToInclude(c);\n                const Vec3f margin{ mesh->SurfaceThickness, mesh->SurfaceThickness,\n                    mesh->SurfaceThickness };\n                bounds = AABBf::FromMinMax(bounds.Min - margin, bounds.Max + margin);\n                primitives.push_back({\n                    static_cast<SpatialID>(index), bounds, CollisionLayer::All });\n            }\n\n            BVHBuildSettings settings;\n            settings.MaxLeafSize = 4u;\n            settings.MaxDepth = 64u;\n            settings.UseSAH = true;\n            mesh->Acceleration = BuildBVH(primitives, settings);\n            if (!mesh->Acceleration.IsValid())\n                throw std::runtime_error(\n                    "TriangleMeshCollider failed to build a valid acceleration BVH.");\n        }\n        else if (auto* plane = std::get_if<PlaneCollider>(&shape))\n        {\n            RequireFinite(plane->Normal, "PlaneCollider.Normal");\n            RequireFinite(plane->Distance, "PlaneCollider.Distance");\n            plane->Normal = SafeNormalize(plane->Normal, Vec3f::Up());\n        }\n\n        return { id, true, body, localCenter, localRotation.Normalized(),\n            std::move(shape), material, 1u, 0xFFFF'FFFFu, false, 1u };'''
          if anchor not in s:
              raise SystemExit('MakeCollider tail anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # Narrowphase: BVH candidate filtering + thin triangle prisms.
          # ------------------------------------------------------------
          p = Path('Narrowphase.cppm')
          s = p.read_text()
          s = s.replace(
              'import Kairo.Foundation.Geometry.Plane;\nimport Kairo.Foundation.PhysicsMath;',
              'import Kairo.Foundation.Geometry.Plane;\nimport Kairo.Foundation.Spatial.BVHTraversal;\nimport Kairo.Foundation.PhysicsMath;', 1)

          anchor = '''    /// Input: two colliders and their owning bodies.\n    /// Output: contact manifold when the shapes overlap.\n    /// Task: perform exact V1 collision tests after broadphase candidate pairing.'''
          helpers = r'''    [[nodiscard]]
    inline AABBf WorldBoundsToColliderLocal(
        const RigidBody& body,
        const Collider& collider,
        const AABBf& worldBounds)
    {
        const Vec3f center = WorldColliderCenter(body, collider);
        const Quaternionf inverse = WorldColliderRotation(body, collider).Conjugate();
        AABBf local = AABBf::Empty();
        for (std::uint32_t mask = 0u; mask < 8u; ++mask)
        {
            const Vec3f corner
            {
                (mask & 1u) != 0u ? worldBounds.Max.x : worldBounds.Min.x,
                (mask & 2u) != 0u ? worldBounds.Max.y : worldBounds.Min.y,
                (mask & 4u) != 0u ? worldBounds.Max.z : worldBounds.Min.z
            };
            local.ExpandToInclude(Rotate(inverse, corner - center));
        }
        return local;
    }

    [[nodiscard]]
    inline ConvexHullCollider MakeTriangleCollisionPrism(
        const TriangleMeshCollider& mesh,
        std::size_t triangleIndex)
    {
        const auto& triangle = mesh.Triangles.at(triangleIndex);
        const Vec3f a = mesh.Vertices.at(triangle[0]);
        const Vec3f b = mesh.Vertices.at(triangle[1]);
        const Vec3f c = mesh.Vertices.at(triangle[2]);
        const Vec3f normal = SafeNormalize(Cross(b - a, c - a), Vec3f::Up());
        const Vec3f offset = normal * (mesh.SurfaceThickness * 0.5f);
        return {
            { a + offset, b + offset, c + offset,
              a - offset, b - offset, c - offset },
            {
                { 0u, 1u, 2u }, { 3u, 5u, 4u },
                { 0u, 3u, 4u }, { 0u, 4u, 1u },
                { 1u, 4u, 5u }, { 1u, 5u, 2u },
                { 2u, 5u, 3u }, { 2u, 3u, 0u }
            }
        };
    }

    [[nodiscard]]
    inline bool IsTriangleMeshConvexPeer(const Collider& collider) noexcept
    {
        return !std::holds_alternative<PlaneCollider>(collider.Shape) &&
            !std::holds_alternative<TriangleMeshCollider>(collider.Shape);
    }

    [[nodiscard]]
    inline std::optional<ContactManifold> CollideTriangleMesh(
        const RigidBody& meshBody,
        const Collider& meshCollider,
        const TriangleMeshCollider& mesh,
        const RigidBody& otherBody,
        const Collider& otherCollider)
    {
        if (!IsTriangleMeshConvexPeer(otherCollider)) return std::nullopt;

        const AABBf otherBounds = WorldAABB(otherBody, otherCollider);
        if (!otherBounds.IsValid()) return std::nullopt;
        const AABBf localQuery =
            WorldBoundsToColliderLocal(meshBody, meshCollider, otherBounds);
        const auto candidates = kairo::foundation::spatial::QueryAABB(
            mesh.Acceleration, localQuery);

        std::optional<ConvexPenetration> deepest;
        for (const auto triangleIndex : candidates.PrimitiveIndices)
        {
            if (triangleIndex >= mesh.Triangles.size()) continue;
            Collider prism = meshCollider;
            prism.Shape = MakeTriangleCollisionPrism(mesh, triangleIndex);
            const auto penetration =
                CollideConvex(meshBody, prism, otherBody, otherCollider);
            if (penetration && (!deepest || penetration->Depth > deepest->Depth))
                deepest = penetration;
        }

        if (!deepest) return std::nullopt;
        ContactManifold manifold = MakeContactManifold(
            meshBody.ID, otherBody.ID, meshCollider.ID, otherCollider.ID,
            meshCollider.IsTrigger || otherCollider.IsTrigger);
        manifold.Points.push_back(MakeContactPoint(
            deepest->Position, deepest->Normal, deepest->Depth));
        return manifold;
    }

'''
          if anchor not in s:
              raise SystemExit('Narrowphase helper anchor not found')
          s = s.replace(anchor, helpers + anchor, 1)

          anchor = '''        const Vec3f centerB =\n            WorldColliderCenter(bodyB, colliderB);\n\n        if (std::holds_alternative<ConvexHullCollider>(colliderA.Shape))'''
          replacement = '''        const Vec3f centerB =\n            WorldColliderCenter(bodyB, colliderB);\n\n        if (const auto* meshA = std::get_if<TriangleMeshCollider>(&colliderA.Shape))\n        {\n            return CollideTriangleMesh(\n                bodyA, colliderA, *meshA, bodyB, colliderB);\n        }\n\n        if (std::holds_alternative<TriangleMeshCollider>(colliderB.Shape))\n        {\n            const auto swapped = CollidePair(bodyB, colliderB, bodyA, colliderA);\n            if (!swapped) return std::nullopt;\n            ContactManifold result = MakeContactManifold(\n                bodyA.ID, bodyB.ID, colliderA.ID, colliderB.ID,\n                colliderA.IsTrigger || colliderB.IsTrigger);\n            for (ContactPoint point : swapped->Points)\n            {\n                point.Normal = -point.Normal;\n                result.Points.push_back(point);\n            }\n            return result;\n        }\n\n        if (std::holds_alternative<ConvexHullCollider>(colliderA.Shape))'''
          if anchor not in s:
              raise SystemExit('Narrowphase mesh dispatch anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # PhysicsWorld: static restriction, exact BVH ray and sweep support.
          # ------------------------------------------------------------
          p = Path('PhysicsWorld.cppm')
          s = p.read_text()

          anchor = '''            if (!IsValidBody(body))\n            {\n                throw std::out_of_range("AddCollider failed: body id does not exist or is inactive.");\n            }\n\n            const ColliderID id ='''
          replacement = '''            if (!IsValidBody(body))\n            {\n                throw std::out_of_range("AddCollider failed: body id does not exist or is inactive.");\n            }\n\n            if (std::holds_alternative<TriangleMeshCollider>(shape) &&\n                m_Bodies.at(body).Type != BodyType::Static)\n                throw std::invalid_argument(\n                    "TriangleMeshCollider is static-only until concave dynamic manifold support lands.");\n\n            const ColliderID id ='''
          if anchor not in s:
              raise SystemExit('PhysicsWorld AddCollider anchor not found')
          s = s.replace(anchor, replacement, 1)

          anchor = '''        [[nodiscard]]\n        static bool RaycastCollider(\n            const RigidBody& body,'''
          ray_helpers = r'''        [[nodiscard]]
        static bool RaycastTriangle(
            const Vec3f& origin,
            const Vec3f& direction,
            const Vec3f& a,
            const Vec3f& b,
            const Vec3f& c,
            bool doubleSided,
            float maxDistance,
            float& distance,
            Vec3f& normal)
        {
            constexpr float epsilon = 1.0e-7f;
            const Vec3f edge1 = b - a;
            const Vec3f edge2 = c - a;
            const Vec3f p = Cross(direction, edge2);
            const float determinant = Dot(edge1, p);
            if (doubleSided ? std::abs(determinant) <= epsilon
                            : determinant <= epsilon)
                return false;

            const float inverse = 1.0f / determinant;
            const Vec3f t = origin - a;
            const float u = Dot(t, p) * inverse;
            if (u < 0.0f || u > 1.0f) return false;
            const Vec3f q = Cross(t, edge1);
            const float v = Dot(direction, q) * inverse;
            if (v < 0.0f || u + v > 1.0f) return false;
            const float candidate = Dot(edge2, q) * inverse;
            if (candidate < 0.0f || candidate > maxDistance) return false;

            distance = candidate;
            normal = SafeNormalize(Cross(edge1, edge2), -direction);
            if (Dot(normal, direction) > 0.0f) normal = -normal;
            return true;
        }

        [[nodiscard]]
        static bool RaycastTriangleMesh(
            const RigidBody& body,
            const Collider& collider,
            const TriangleMeshCollider& mesh,
            const Vec3f& origin,
            const Vec3f& direction,
            float maxDistance,
            float& distance,
            Vec3f& normal)
        {
            const Vec3f center = WorldColliderCenter(body, collider);
            const Quaternionf rotation = WorldColliderRotation(body, collider);
            const Quaternionf inverse = rotation.Conjugate();
            const Vec3f localOrigin = Rotate(inverse, origin - center);
            const Vec3f localDirection = Rotate(inverse, direction);
            const kairo::foundation::spatial::SpatialRay ray{
                localOrigin, localDirection };

            const auto result = kairo::foundation::spatial::Raycast(
                mesh.Acceleration, ray,
                [&](kairo::foundation::spatial::SpatialIndex triangleIndex,
                    const kairo::foundation::spatial::SpatialRay& localRay)
                    -> std::optional<kairo::foundation::spatial::SpatialRayHit>
                {
                    if (triangleIndex >= mesh.Triangles.size()) return std::nullopt;
                    const auto& triangle = mesh.Triangles[triangleIndex];
                    float localDistance = 0.0f;
                    Vec3f localNormal = -localRay.Direction;
                    if (!RaycastTriangle(localRay.Origin, localRay.Direction,
                        mesh.Vertices[triangle[0]], mesh.Vertices[triangle[1]],
                        mesh.Vertices[triangle[2]], mesh.DoubleSided,
                        maxDistance, localDistance, localNormal))
                        return std::nullopt;
                    return kairo::foundation::spatial::SpatialRayHit{
                        {}, triangleIndex, localDistance,
                        localRay.Origin + localRay.Direction * localDistance,
                        localNormal };
                }, maxDistance);

            if (!result.Hit) return false;
            distance = result.Closest.Distance;
            normal = SafeNormalize(Rotate(rotation, result.Closest.Normal), -direction);
            return true;
        }

'''
          if anchor not in s:
              raise SystemExit('RaycastCollider anchor not found')
          s = s.replace(anchor, ray_helpers + anchor, 1)

          anchor = '''            else if (const auto* hull = std::get_if<ConvexHullCollider>(&collider.Shape))\n            {\n                intersects = RaycastConvexHull(\n                    body, collider, *hull, origin, direction,\n                    maxDistance, distance, normal);\n            }\n\n            if (!intersects)'''
          replacement = '''            else if (const auto* hull = std::get_if<ConvexHullCollider>(&collider.Shape))\n            {\n                intersects = RaycastConvexHull(\n                    body, collider, *hull, origin, direction,\n                    maxDistance, distance, normal);\n            }\n            else if (const auto* mesh = std::get_if<TriangleMeshCollider>(&collider.Shape))\n            {\n                intersects = RaycastTriangleMesh(\n                    body, collider, *mesh, origin, direction,\n                    maxDistance, distance, normal);\n            }\n\n            if (!intersects)'''
          if anchor not in s:
              raise SystemExit('Raycast mesh dispatch anchor not found')
          s = s.replace(anchor, replacement, 1)

          anchor = '''        [[nodiscard]]\n        static std::optional<PhysicsSweepHit> SweepSphereCollider(\n            const RigidBody& body,'''
          sweep_helper = r'''        [[nodiscard]]
        static std::optional<PhysicsSweepHit> SweepSphereTriangleMesh(
            const RigidBody& body,
            const Collider& collider,
            const TriangleMeshCollider& mesh,
            const Vec3f& start,
            const Vec3f& displacement,
            float radius)
        {
            const float travelDistance = displacement.Length();
            const Quaternionf rotation = WorldColliderRotation(body, collider);
            const Quaternionf inverse = rotation.Conjugate();
            const Vec3f worldCenter = WorldColliderCenter(body, collider);
            const Vec3f localStart = Rotate(inverse, start - worldCenter);
            const Vec3f localDisplacement = Rotate(inverse, displacement);
            const Vec3f localEnd = localStart + localDisplacement;
            const Vec3f extent{ radius, radius, radius };
            const AABBf swept = AABBf::FromMinMax(
                Min(localStart, localEnd) - extent,
                Max(localStart, localEnd) + extent);
            const auto candidates =
                kairo::foundation::spatial::QueryAABB(mesh.Acceleration, swept);

            std::optional<PhysicsSweepHit> closest;
            constexpr float tolerance = 1.0e-4f;
            for (const auto triangleIndex : candidates.PrimitiveIndices)
            {
                if (triangleIndex >= mesh.Triangles.size()) continue;
                const auto& triangle = mesh.Triangles[triangleIndex];
                const Vec3f a = mesh.Vertices[triangle[0]];
                const Vec3f b = mesh.Vertices[triangle[1]];
                const Vec3f c = mesh.Vertices[triangle[2]];
                float time = 0.0f;
                for (int iteration = 0; iteration < 48; ++iteration)
                {
                    const Vec3f sphereCenter = localStart + localDisplacement * time;
                    const Vec3f trianglePoint =
                        ClosestPointOnConvexTriangle(sphereCenter, a, b, c);
                    const Vec3f delta = sphereCenter - trianglePoint;
                    const float pointDistance = delta.Length();
                    const float separation = pointDistance - radius;
                    Vec3f localNormal = pointDistance > 1.0e-6f
                        ? delta / pointDistance
                        : SafeNormalize(Cross(b - a, c - a), -localDisplacement);
                    if (Dot(localNormal, localDisplacement) > 0.0f)
                        localNormal = -localNormal;

                    if (separation <= tolerance)
                    {
                        const Vec3f worldNormal = SafeNormalize(
                            Rotate(rotation, localNormal), -displacement);
                        const Vec3f worldSphereCenter = start + displacement * time;
                        PhysicsSweepHit hit{
                            body.ID, collider.ID,
                            worldSphereCenter - worldNormal * radius,
                            worldNormal, time * travelDistance, time,
                            collider.IsTrigger };
                        if (!closest || hit.Distance < closest->Distance)
                            closest = hit;
                        break;
                    }

                    time += separation / travelDistance;
                    if (time > 1.0f) break;
                }
            }
            return closest;
        }

'''
          if anchor not in s:
              raise SystemExit('SweepSphereCollider anchor not found')
          s = s.replace(anchor, sweep_helper + anchor, 1)

          anchor = '''        {\n            const float travelDistance = displacement.Length();\n            const Vec3f direction = displacement / travelDistance;'''
          replacement = '''        {\n            if (const auto* mesh = std::get_if<TriangleMeshCollider>(&collider.Shape))\n                return SweepSphereTriangleMesh(\n                    body, collider, *mesh, start, displacement, radius);\n\n            const float travelDistance = displacement.Length();\n            const Vec3f direction = displacement / travelDistance;'''
          # Replace only the instance immediately following SweepSphereCollider.
          idx = s.find('static std::optional<PhysicsSweepHit> SweepSphereCollider(')
          if idx < 0:
              raise SystemExit('SweepSphereCollider function not found')
          sub = s[idx:]
          if anchor not in sub:
              raise SystemExit('SweepSphereCollider body anchor not found')
          sub = sub.replace(anchor, replacement, 1)
          s = s[:idx] + sub
          p.write_text(s)

