name: Agent Persistent Manifolds Patch
on:
  push:
    branches:
      - complete/persistent-manifolds
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/persistent-manifolds
          fetch-depth: 0
      - name: Apply persistent manifold implementation
        run: python3 .github/agent_persistent_manifolds_patch.py
      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          rm -f .github/agent_persistent_manifolds_patch.py
          rm -f .github/workflows/agent_persistent_manifolds_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Physics: add persistent multi-point manifolds'
          git push origin HEAD:complete/persistent-manifolds
