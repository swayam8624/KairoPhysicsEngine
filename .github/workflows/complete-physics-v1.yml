name: Complete Physics V1

on:
  push:
    branches: [complete/physics-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/physics-v1
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/complete_physics_v1.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-physics-v1.yml tools/complete_physics_v1.py
          git add PhysicsWorld.cppm Narrowphase.cppm README.md tests/PhysicsEngineTests.cpp
          git diff --cached --check
          git commit -m "Physics: complete moving triangle mesh rigid bodies"
          git push origin HEAD:complete/physics-v1
