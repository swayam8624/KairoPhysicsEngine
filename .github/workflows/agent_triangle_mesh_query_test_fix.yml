name: Agent Triangle Mesh Query Test Fix
on:
  push:
    branches: [complete/triangle-mesh-collision]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/triangle-mesh-collision
          fetch-depth: 0
      - name: Isolate triangle mesh query target
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/PhysicsEngineTests.cpp')
          s = p.read_text()
          old = '''    const auto ray = world.Raycast(
        Vec3f{ 0.0f, 2.0f, 0.0f }, -Vec3f::UnitY(), 10.0f);'''
          new = '''    const auto ray = world.Raycast(
        Vec3f{ 0.0f, 2.0f, 0.0f }, -Vec3f::UnitY(), 10.0f,
        0xFFFF'FFFFu, sphere);'''
          if old not in s:
              raise SystemExit('ray snippet not found')
          s = s.replace(old, new, 1)
          old = '''    const auto sweep = world.SweepSphere(
        Vec3f{ 0.0f, 2.0f, 0.0f }, Vec3f{ 0.0f, -3.0f, 0.0f }, 0.25f);'''
          new = '''    const auto sweep = world.SweepSphere(
        Vec3f{ 0.0f, 2.0f, 0.0f }, Vec3f{ 0.0f, -3.0f, 0.0f }, 0.25f,
        0xFFFF'FFFFu, sphere);'''
          if old not in s:
              raise SystemExit('sweep snippet not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit test fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/agent_triangle_mesh_query_test_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/PhysicsEngineTests.cpp .github/workflows/agent_triangle_mesh_query_test_fix.yml
          git commit -m 'Fix triangle mesh query regression isolation'
          git push origin HEAD:complete/triangle-mesh-collision
