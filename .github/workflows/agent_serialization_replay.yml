name: Agent Physics Serialization Replay

on:
  push:
    branches:
      - complete/serialization-replay
    paths:
      - '.github/workflows/agent_serialization_replay.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
      - name: Apply implementation
        run: |
          base64 -d tools/agent_serialization_replay_payload.b64 | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DKAIRO_PHYSICS_ENGINE_BUILD_TESTS=ON -DKAIRO_PHYSICS_ENGINE_BUILD_SANDBOX=OFF -DKAIRO_PHYSICS_ENGINE_BUILD_GLFW_SANDBOX=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent_serialization_replay.yml tools/agent_serialization_replay_payload.b64
          git add -A
          git commit -m "Physics: add versioned snapshots and deterministic replay"
          git push origin HEAD:complete/serialization-replay
