name: KairoPhysicsEngine CI

on:
  push:
    branches:
      - main
      - 'complete/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Feature-completion branches validate the exact branch head on every supported toolchain.
jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang
            os: ubuntu-latest
            platform: linux
          - name: macOS LLVM
            os: macos-14
            platform: macos
          - name: Windows MSVC
            os: windows-2022
            platform: windows

    steps:
      - uses: actions/checkout@v5

      - name: Activate MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install cmake ninja llvm
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKAIRO_PHYSICS_ENGINE_BUILD_TESTS=ON
          -DKAIRO_PHYSICS_ENGINE_BUILD_SANDBOX=OFF
          -DKAIRO_PHYSICS_ENGINE_BUILD_GLFW_SANDBOX=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
