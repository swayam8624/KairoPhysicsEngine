name: Agent PhysicsWorld Import Fix

on:
  push:
    branches:
      - complete/triangle-mesh-collision

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/triangle-mesh-collision
          fetch-depth: 0

      - name: Add explicit quaternion module dependency
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('PhysicsWorld.cppm')
          s = p.read_text()
          old = 'import Kairo.Foundation.Math.Vector;\nimport Kairo.Foundation.Math.Matrix;'
          new = 'import Kairo.Foundation.Math.Vector;\nimport Kairo.Foundation.Math.Matrix;\nimport Kairo.Foundation.Math.Quaternion;'
          if old not in s:
              raise SystemExit('PhysicsWorld import anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit source fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/agent_physicsworld_import_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PhysicsWorld.cppm .github/workflows/agent_physicsworld_import_fix.yml
          git commit -m "Fix explicit PhysicsWorld quaternion import"
          git push origin HEAD:complete/triangle-mesh-collision
