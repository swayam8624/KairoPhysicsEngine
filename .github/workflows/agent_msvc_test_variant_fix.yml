name: Agent MSVC Test Variant Fix
on:
  push:
    branches:
      - complete/triangle-mesh-collision
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/triangle-mesh-collision
          fetch-depth: 0
      - name: Add explicit variant header to tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/PhysicsEngineTests.cpp')
          s = p.read_text()
          marker = '#include <catch2/catch_test_macros.hpp>\n'
          if '#include <variant>' not in s:
              if marker not in s:
                  raise SystemExit('include marker not found')
              s = s.replace(marker, marker + '#include <variant>\n', 1)
          p.write_text(s)
          PY
      - name: Commit test portability fix and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/agent_msvc_test_variant_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MSVC test variant include'
          git push origin HEAD:complete/triangle-mesh-collision
