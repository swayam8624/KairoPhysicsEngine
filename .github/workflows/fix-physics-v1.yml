name: Fix Physics V1 Test

on:
  push:
    branches: [complete/physics-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/physics-v1
          fetch-depth: 0
      - name: Apply fix
        run: python3 tools/fix_physics_v1_test.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-physics-v1.yml tools/fix_physics_v1_test.py
          git add tests/PhysicsEngineTests.cpp
          git diff --cached --check
          git commit -m "Tests: fix moving mesh pair assertion"
          git push origin HEAD:complete/physics-v1
